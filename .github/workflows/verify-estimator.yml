name: Verify estimator repair
on:
  push:
    branches: ['repair/estimator-2026-10-11']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact public source
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/commit.txt
          git archive --format=zip HEAD -o verification/source.zip
      - name: Install Python regression dependencies
        run: python -m pip install fastapi==0.141.1 uvicorn==0.52.4 ijson==3.5.1 shapely==2.1.2 pyproj==3.7.2 PyYAML==6.0.3 numpy
      - name: Run existing regression suite
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -m unittest discover -s tests -v 2>&1 | tee verification/unittest.txt
      - name: Upload source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estimator-verification
          path: verification/
          retention-days: 7
