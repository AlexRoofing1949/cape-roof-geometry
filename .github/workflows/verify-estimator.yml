name: Verify estimator repair
on:
  push:
    branches: ['repair/estimator-2026-10-11']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: estimator-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply baseline-checked repairs
        run: |
          mkdir -p verification
          python tools/apply_estimator_repairs.py
          python tools/repair_overture_release_policy.py
          git diff --check
      - name: Install full regression dependencies
        run: python -m pip install fastapi==0.141.1 uvicorn==0.52.4 ijson==3.5.1 shapely==2.1.2 pyproj==3.7.2 PyYAML==6.0.3 open3d-cpu==0.19.0
      - name: Run regression suite
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -m unittest discover -s tests -v 2>&1 | tee verification/unittest.txt
          if test -f tests/test_apps_script_repair.cjs; then
            node --test tests/test_apps_script_repair.cjs 2>&1 | tee verification/apps-script-tests.txt
          fi
      - name: Commit verified source only to the repair branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/repair/estimator-2026-10-11'
        shell: bash
        run: |
          git add app/pipeline.py app/providers.py tests/test_regional_sources.py
          if ! git diff --cached --quiet; then
            git fetch origin repair/estimator-2026-10-11
            test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
            git config user.name 'CapeRoof verified repair'
            git config user.email 'noreply@caperoof.com'
            git commit -m 'Repair geometry and audit current Overture releases'
            git push origin HEAD:refs/heads/repair/estimator-2026-10-11
          fi
      - name: Read public production health without credentials
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          from datetime import datetime, timezone
          result = {'checkedAt': datetime.now(timezone.utc).isoformat()}
          try:
              with urllib.request.urlopen('https://geometry.caperoof.com/healthz', timeout=40) as response:
                  payload = json.load(response)
                  result.update(httpStatus=response.status)
                  result.update({key: payload.get(key) for key in ('status','configured','dependencies','serviceCommit','registryVersion')})
          except urllib.error.HTTPError as error:
              result.update(httpStatus=error.code)
          except Exception as error:
              result.update(errorType=type(error).__name__)
          with open('verification/production-health.json','w') as output:
              json.dump(result, output, indent=2)
          print(json.dumps(result))
          PY
      - name: Preserve exact tested source and evidence
        if: always()
        run: |
          git rev-parse HEAD > verification/commit.txt
          git diff > verification/uncommitted.patch
          git archive --format=zip HEAD -o verification/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: estimator-verification
          path: verification/
          retention-days: 7
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply identical reviewed source changes
        run: |
          python3 tools/apply_estimator_repairs.py
          python3 tools/repair_overture_release_policy.py
          mkdir -p native-evidence
      - name: Build pinned production image
        shell: bash
        run: |
          set -o pipefail
          docker build -t caperoof-native-check . 2>&1 | tee native-evidence/build.txt
      - name: Measure a synthetic gable with real PDAL Roofer and Open3D
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -e PYTHONPATH=/srv/cape-roof-geometry -v "$PWD/tools:/checks:ro" caperoof-native-check python /checks/native_geometry_smoke.py 2>&1 | tee native-evidence/smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-geometry-evidence
          path: native-evidence/
          retention-days: 7
